    Projects:
      - name: "Senior Capstone: Trash vs. Recycling Robot"
        url: https://github.com/owen-hoffman40/trash_bot
        summary: ROS 2 mobile robot system for approaching seated users, collecting deposited items, and routing trash and recycling to separate bins.
        highlights:
          - Implemented a CasADi-based model predictive controller with obstacle-avoidance constraints and finite-horizon linear and angular velocity optimization.
          - Collaborated on the broader perception-to-control pipeline in a three-person team.

      - name: Autonomous TurtleBot Cone-Course Navigation
        summary: Camera-based autonomous navigation using ROS and Python.
        highlights:
          - Integrated visual perception, wheel-encoder odometry, and ROS frame transforms.
          - Implemented pure pursuit, acceleration filtering, lost-gate recovery, and emergency stops from bumper and cliff sensors.

